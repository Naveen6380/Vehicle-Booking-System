spring:
  datasource:
    url: jdbc:mysql://localhost:3306/heavy_equipment_rental?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql@9087}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update          # auto-creates/updates tables from entities (dev only)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.heavyequip.rental: DEBUG
    org.hibernate.SQL: DEBUG

  web:
    resources:
      static-locations: classpath:/static/,file:uploads/